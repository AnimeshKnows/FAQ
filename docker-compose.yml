services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: faq-backend:latest
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-DevDocs RAG}
      DEBUG: ${DEBUG:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf
      SENTENCE_TRANSFORMERS_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-10}
      RERANK_TOP_K: ${RERANK_TOP_K:-5}
    volumes:
      # Persist HF model downloads (large); reuse across rebuilds
      - hf_cache:/cache/hf
      # Use host index from local ingest, or rebuild inside the container
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/raw:/app/data/raw:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - faq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin: browser → nginx → backend
        VITE_API_BASE_URL: ""
    image: faq-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - faq-net

  # One-shot: docker compose --profile tools run --rm ingest
  ingest:
    profiles: ["tools"]
    image: faq-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf
      SENTENCE_TRANSFORMERS_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
    volumes:
      - hf_cache:/cache/hf
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/raw:/app/data/raw:ro
    command: ["python", "scripts/ingest.py"]
    networks:
      - faq-net

volumes:
  hf_cache:

networks:
  faq-net:
    driver: bridge
