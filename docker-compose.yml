services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - faq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: faq-backend:latest
    restart: unless-stopped
    # Internal only — scale with: docker compose up --scale backend=2
    # Debug API on host: docker compose run --rm -p 8000:8000 backend
    env_file:
      - .env
    environment:
      APP_NAME: ${APP_NAME:-DevDocs RAG}
      DEBUG: ${DEBUG:-false}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf
      SENTENCE_TRANSFORMERS_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-10}
      RERANK_TOP_K: ${RERANK_TOP_K:-5}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_CHAT: ${RATE_LIMIT_CHAT:-20/minute}
      RATE_LIMIT_RETRIEVE: ${RATE_LIMIT_RETRIEVE:-60/minute}
      RATE_LIMIT_INGEST: ${RATE_LIMIT_INGEST:-3/hour}
      INDEX_VERSION_KEEP: ${INDEX_VERSION_KEEP:-5}
    volumes:
      - hf_cache:/cache/hf
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/raw:/app/data/raw:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - faq-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: faq-frontend:latest
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - faq-net

  # One-shot: docker compose --profile tools run --rm ingest
  ingest:
    profiles: ["tools"]
    image: faq-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /cache/hf
      TRANSFORMERS_CACHE: /cache/hf
      SENTENCE_TRANSFORMERS_HOME: /cache/hf
      HF_HUB_CACHE: /cache/hf/hub
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-base}
      INDEX_VERSION_KEEP: ${INDEX_VERSION_KEEP:-5}
    volumes:
      - hf_cache:/cache/hf
      - ./backend/vectorstore:/app/vectorstore
      - ./backend/data/processed:/app/data/processed
      - ./backend/data/raw:/app/data/raw:ro
    command: ["python", "scripts/ingest.py"]
    networks:
      - faq-net

  # One-shot: docker compose --profile tools run --rm backup
  backup:
    profiles: ["tools"]
    image: faq-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INDEX_VERSION_KEEP: ${INDEX_VERSION_KEEP:-5}
    volumes:
      - ./backend/vectorstore:/app/vectorstore
    command: ["python", "scripts/backup_index.py"]
    networks:
      - faq-net

volumes:
  hf_cache:

networks:
  faq-net:
    driver: bridge
